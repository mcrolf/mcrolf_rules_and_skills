<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Inventory</title>
  <style>
    /* Slots and these class names are the contract with scripts/render_inventory.py. */
    :root {
      --paper: #e5dccb;
      --card: #f7f1e6;
      --ink: #241c15;
      --muted: #5c5146;
      --rule: #d2c4b0;
      --stamp: #7a2e24;
      --pine: #1c3d34;
      --index: #f3e4d8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Charter, "Iowan Old Style", Georgia, serif;
      font-size: 17px;
      line-height: 1.45;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 2.75rem 1.5rem 4.5rem;
    }

    header {
      border-top: 8px solid var(--pine);
      padding-top: 1.25rem;
      margin-bottom: 1.75rem;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--stamp);
    }

    h1 {
      margin: 0;
      font-family: Didot, "Bodoni 72", "Bodoni MT", serif;
      font-size: 3.1rem;
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .lede {
      max-width: 38rem;
      margin: 0.9rem 0 0;
      color: var(--muted);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem 2.5rem;
      margin: 1.25rem 0 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.92rem;
    }

    .meta div { margin: 0; }
    .meta dt {
      margin: 0;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pine);
    }
    .meta dd { margin: 0.15rem 0 0; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin: 0 0 1.75rem;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--rule);
      border-top: 3px solid var(--pine);
      padding: 0.8rem 0.9rem 0.7rem;
    }

    .stat .n {
      display: block;
      font-family: Didot, "Bodoni 72", "Bodoni MT", serif;
      font-size: 2.1rem;
      line-height: 1;
    }

    .stat .l {
      display: block;
      margin-top: 0.35rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .project {
      display: grid;
      grid-template-columns: 4.75rem 1fr;
      background: var(--card);
      border: 1px solid var(--rule);
      margin: 1rem 0;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .index {
      display: flex;
      justify-content: center;
      padding-top: 1rem;
      background: var(--index);
      border-right: 1px solid var(--rule);
      color: var(--stamp);
      font-family: Didot, "Bodoni 72", "Bodoni MT", serif;
      font-size: 1.7rem;
      line-height: 1;
    }

    .body { padding: 1rem 1.15rem 1.15rem; }

    h2 {
      margin: 0 0 0.35rem;
      font-family: Didot, "Bodoni 72", "Bodoni MT", serif;
      font-size: 1.85rem;
      font-weight: 400;
      line-height: 1.05;
    }

    h3 {
      margin: 1.15rem 0 0.4rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--pine);
    }

    .summary { margin: 0.2rem 0 0.85rem; }

    .fields {
      display: grid;
      grid-template-columns: 8.5rem 1fr;
      gap: 0.28rem 0.75rem;
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.92rem;
    }

    .fields dt { margin: 0; color: var(--muted); }
    .fields dd { margin: 0; }

    .repos, .unknowns { margin: 0; padding-left: 1.1rem; }
    .repos li, .unknowns li { margin: 0.2rem 0; }

    .host, .remote {
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .host { color: var(--pine); margin-right: 0.35rem; }
    .remote { color: var(--muted); margin-left: 0.35rem; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.88rem;
    }

    th, td {
      padding: 0.4rem 0.45rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--rule);
    }

    th {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--pine);
    }

    code, a {
      overflow-wrap: anywhere;
    }

    code {
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.82em;
    }

    a { color: var(--pine); }

    .notes {
      margin: 0;
      font-style: italic;
    }

    .missing { color: var(--muted); }

    @media (max-width: 700px) {
      h1 { font-size: 2.4rem; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .project { grid-template-columns: 1fr; }
      .index {
        justify-content: flex-start;
        padding: 0.55rem 1rem;
        border-right: 0;
        border-bottom: 1px solid var(--rule);
      }
      .fields { grid-template-columns: 1fr; }
    }

    @media print {
      * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      body { background: white; }
      main { max-width: none; padding: 0; }
      a { text-decoration: none; }
    }

    @page { size: letter; margin: 14mm 12mm; }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Inventory report</p>
      <h1>Project Inventory</h1>
      <p class="lede">Project name, GitHub repos, server resources, and other notes for the projects in this Development folder.</p>
      <dl class="meta">
        <div>
          <dt>Updated</dt>
          <dd><!-- UPDATED --><!-- /UPDATED --></dd>
        </div>
        <div>
          <dt>Development folder</dt>
          <dd><!-- ROOT --><!-- /ROOT --></dd>
        </div>
      </dl>
    </header>
    <!-- SUMMARY --><!-- /SUMMARY -->
    <!-- PROJECTS --><!-- /PROJECTS -->
  </main>
</body>
</html>
